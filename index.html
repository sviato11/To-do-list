<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do List</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1 class="title">To-do List</h1>
      <p class="subtitle">Save your notes and tasks.</p>
    </header>
    <form>
      <input id="task-input" type="text" placeholder="Your task...">
      <button id="add-task">Add task</button>
    </form>
    <div class="tasks">
      <ul>
        <li class="task-card">
          <p class="task">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Cras at nisl consectetur, aliquam ante ac, vestibulum enim. Sed eu elit sit amet dolor tempor pharetra</p>
          <div class="actions">
            <button class="complete-task">Complete</button>
            <button class="delete-task">Delete</button>
          </div>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
